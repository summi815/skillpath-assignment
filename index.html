  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    const API_COURSES_URL = "https://syncsphere-hiv6.onrender.com/assignment/course-data";
    const API_COUNTRY_URL = "https://syncsphere-hiv6.onrender.com/assignment/country-code";
    const DEFAULT_FALLBACK_COUNTRY = "US";

    function formatPrice(course, countryCode) {
      const isIndia = countryCode && countryCode.toUpperCase() === "IN";
      if (isIndia) {
        const paise = typeof course.pricePaise === "number" ? course.pricePaise : 0;
        const rupees = paise / 100;
        const formatter = new Intl.NumberFormat("en-IN", {
          style: "currency",
          currency: "INR",
          maximumFractionDigits: 0,
        });
        return { formatted: formatter.format(rupees), numericValue: rupees };
      }
      const cents = typeof course.priceUsdCents === "number" ? course.priceUsdCents : 0;
      const dollars = cents / 100;
      const formatter = new Intl.NumberFormat("en-US", {
        style: "currency",
        currency: "USD",
        minimumFractionDigits: 2,
        maximumFractionDigits: 2,
      });
      return { formatted: formatter.format(dollars), numericValue: dollars };
    }

    function SkillpathCourses({ accentColor = "#2563EB", cardBorderRadius = 16 }) {
      const [courses, setCourses] = useState([]);
      const [countryCode, setCountryCode] = useState(DEFAULT_FALLBACK_COUNTRY);
      const [status, setStatus] = useState("loading");
      const [countryFailed, setCountryFailed] = useState(false);
      const [searchQuery, setSearchQuery] = useState("");
      const [sortBy, setSortBy] = useState("featured");
      const [fetchCount, setFetchCount] = useState(0);

      // Enrollment State
      const [enrolledMap, setEnrolledMap] = useState({});
      const [selectedCourseForModal, setSelectedCourseForModal] = useState(null);
      const [toastMessage, setToastMessage] = useState(null);

      const handleRetry = useCallback(() => {
        setStatus("loading");
        setFetchCount(prev => prev + 1);
      }, []);

      useEffect(() => {
        const abortController = new AbortController();
        const { signal } = abortController;

        async function fetchWithSingleRetry(url) {
          try {
            const res = await fetch(url, { signal });
            if (res.ok) return await res.json();
            throw new Error(`HTTP ${res.status}`);
          } catch (firstErr) {
            if (signal.aborted) throw firstErr;
            await new Promise(r => setTimeout(r, 600));
            if (signal.aborted) throw firstErr;
            const retryRes = await fetch(url, { signal });
            if (retryRes.ok) return await retryRes.json();
            throw new Error(`HTTP ${retryRes.status}`);
          }
        }

        async function loadData() {
          setStatus("loading");
          try {
            const [coursesResult, countryResult] = await Promise.allSettled([
              fetchWithSingleRetry(API_COURSES_URL),
              fetchWithSingleRetry(API_COUNTRY_URL),
            ]);

            if (signal.aborted) return;

            if (coursesResult.status === "rejected") {
              console.error("Course fetch failed:", coursesResult.reason);
              setStatus("error");
              return;
            }

            const rawCourseData = coursesResult.value;
            if (!Array.isArray(rawCourseData)) {
              setStatus("error");
              return;
            }

            if (rawCourseData.length === 0) {
              setCourses([]);
              setStatus("empty");
              return;
            }

            if (countryResult.status === "fulfilled" && countryResult.value?.country_code) {
              setCountryCode(String(countryResult.value.country_code).toUpperCase());
              setCountryFailed(false);
            } else {
              setCountryCode(DEFAULT_FALLBACK_COUNTRY);
              setCountryFailed(true);
            }

            setCourses(rawCourseData);
            setStatus("success");
          } catch (err) {
            if (signal.aborted) return;
            console.error("Unexpected fetch error:", err);
            setStatus("error");
          }
        }

        loadData();
        return () => abortController.abort();
      }, [fetchCount]);

      const filteredAndSortedCourses = useMemo(() => {
        if (!courses || courses.length === 0) return [];
        const query = searchQuery.trim().toLowerCase();
        let result = courses.filter((course) => {
          if (!query) return true;
          const name = (course.courseName || "").toLowerCase();
          const category = (course.mainCategory || "").toLowerCase();
          const desc = (course.description || "").toLowerCase();
          return name.includes(query) || category.includes(query) || desc.includes(query);
        });

        if (sortBy === "price-asc") {
          result = [...result].sort((a, b) => formatPrice(a, countryCode).numericValue - formatPrice(b, countryCode).numericValue);
        } else if (sortBy === "price-desc") {
          result = [...result].sort((a, b) => formatPrice(b, countryCode).numericValue - formatPrice(a, countryCode).numericValue);
        }
        return result;
      }, [courses, searchQuery, sortBy, countryCode]);

      const handleOpenEnrollment = (course, formattedPrice) => {
        const id = course.courseCode || course.courseName;
        if (enrolledMap[id]) {
          setToastMessage(`✓ You have already joined "${course.courseName}". Access details sent to your email!`);
          setTimeout(() => setToastMessage(null), 4000);
          return;
        }
        setSelectedCourseForModal({ course, formattedPrice });
      };

      const handleConfirmEnrollment = () => {
        if (!selectedCourseForModal) return;
        const course = selectedCourseForModal.course;
        const id = course.courseCode || course.courseName;

        setEnrolledMap(prev => ({
          ...prev,
          [id]: true
        }));

        const title = course.courseName;
        setSelectedCourseForModal(null);
        setToastMessage(`🎉 Congratulations! You are now enrolled in "${title}". Welcome aboard!`);
        setTimeout(() => setToastMessage(null), 5000);
      };

      return (

              margin: 0 auto 36px auto;
            }

              display: inline-flex;

              gap: 6px;

              border-radius: 9999px;
              background-color: rgba(37, 99, 235, 0.08);
              color: var(--sp-accent);

            .sp-title {

              letter-spacing: -0.03em;
              margin-bottom: 12px;
            }

              font-size: 17px;

            }
            .sp-toolbar {
              display: flex;
              flex-wrap: wrap;

              justify-content: space-between;
              align-items: center;

            }
            .sp-search-box {

            }
            .sp-search-icon {
              position: absolute;
              left: 14px;

          <div className="sp-header-wrap">
            <span className="sp-badge-pill">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" /></svg>
              Practical Masterclasses
            </span>
            <h2 className="sp-title">Explore Career-Defining Skills</h2>
            <p className="sp-subtitle">
              Learn direct, battle-tested frameworks from industry operators. Built for modern creators and builders.
            </p>
          </div>

          {status !== "error" && (
            <div className="sp-toolbar">
              <div className="sp-search-box">
                <span className="sp-search-icon">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                </span>
                <input
                  type="text"
                  className="sp-search-input"
                  placeholder="Search courses or categories..."
                  value={searchQuery}
                  onChange={(e) => setSearchQuery(e.target.value)}
                  aria-label="Search courses"
                />
              </div>

              <div className="sp-sort-group">
                <label htmlFor="sp-sort-select" className="sp-sort-label">Sort by:</label>
                <select
                  id="sp-sort-select"
                  className="sp-sort-select"
                  value={sortBy}
                  onChange={(e) => setSortBy(e.target.value)}
                  aria-label="Sort courses"
                >
                  <option value="featured">Featured (Default)</option>
                  <option value="price-asc">Price: Low to High</option>
                  <option value="price-desc">Price: High to Low</option>
                </select>
              </div>
            </div>
          )}

          {status === "success" && countryFailed && (
            <div className="sp-fallback-banner" role="status">
              <span><strong>Note:</strong> Standard USD pricing shown (location service temporarily unavailable).</span>
              <span style={{ fontSize: "12px", color: "#64748b" }}>All guarantees & course access remain fully active.</span>
            </div>
          )}

          {status === "loading" && (
            <div className="sp-grid" aria-busy="true">
              {[1, 2, 3, 4, 5, 6].map((idx) => (
                <div key={idx} className="sp-skeleton-card">
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                    <div className="sp-skeleton-box" style={{ width: "90px", height: "20px" }} />
                    <div className="sp-skeleton-box" style={{ width: "65px", height: "18px", borderRadius: "9999px" }} />
                  </div>
                  <div className="sp-skeleton-box" style={{ width: "85%", height: "24px", marginTop: "4px" }} />
                  <div className="sp-skeleton-box" style={{ width: "100%", height: "16px" }} />
                  <div className="sp-skeleton-box" style={{ width: "70%", height: "16px" }} />
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: "16px", paddingTop: "14px", borderTop: "1px solid #f1f5f9" }}>
                    <div className="sp-skeleton-box" style={{ width: "70px", height: "28px" }} />
                    <div className="sp-skeleton-box" style={{ width: "84px", height: "36px", borderRadius: "8px" }} />
                  </div>
                </div>
              ))}
            </div>
          )}

          {status === "error" && (
            <div className="sp-state-container" role="alert">
              <div className="sp-state-icon error">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
              </div>
              <h3 className="sp-state-title">Unable to Load Courses</h3>
              <p className="sp-state-desc">We encountered a temporary connection issue while retrieving the latest course schedule. Please try refreshing.</p>
              <button className="sp-retry-btn" onClick={handleRetry}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
                Retry Connection
              </button>
            </div>
          )}

          {status === "empty" || (status === "success" && filteredAndSortedCourses.length === 0) ? (
            <div className="sp-state-container" role="status">
              <div className="sp-state-icon empty">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
              </div>
              <h3 className="sp-state-title">
                {status === "empty" ? "No Courses Available" : "No Matching Courses Found"}
              </h3>
              <p className="sp-state-desc">
                {status === "empty"
                  ? "There are currently no active cohorts scheduled. Check back shortly for upcoming releases."
                  : `No results matching "${searchQuery}". Try searching for another keyword or clear your filter.`}
              </p>
              {searchQuery && (
                <button className="sp-retry-btn" onClick={() => setSearchQuery("")} style={{ background: "#475569" }}>
                  Clear Search Filter
                </button>
              )}
            </div>
          ) : null}

          {status === "success" && filteredAndSortedCourses.length > 0 && (
            <div className="sp-grid">
              {filteredAndSortedCourses.map((course) => {
                const priceInfo = formatPrice(course, countryCode);
                const key = course.mangoId || course.courseCode || course.courseName;
                const isEnrolled = !!enrolledMap[course.courseCode || course.courseName];

                return (
                  <article key={key} className={`sp-card ${isEnrolled ? "enrolled" : ""}`}>
                    <div>
                      <div className="sp-card-top">
                        <span className="sp-category-tag">{course.mainCategory || "Course"}</span>
                        {isEnrolled ? (
                          <span className="sp-refundable-badge" style={{ background: "#dcfce7", color: "#15803d", borderColor: "#86efac" }}>
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>
                            Active Learner
                          </span>
                        ) : course.refundable ? (
                          <span className="sp-refundable-badge" title="100% Refundable within 14 days">
                            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3"><polyline points="20 6 9 17 4 12"/></svg>
                            Refundable
                          </span>
                        ) : null}
                      </div>
                      <h3 className="sp-course-title">{course.courseName || "Untitled Course"}</h3>
                      <p className="sp-course-desc" title={course.description}>
                        {course.description || "Comprehensive hands-on training and actionable frameworks."}
                      </p>
                    </div>
                    <div className="sp-card-footer">
                      <div className="sp-price-wrap">
                        <span className="sp-price-label">{isEnrolled ? "Status" : "Tuition"}</span>
                        <span className="sp-price-val" style={{ fontSize: isEnrolled ? "18px" : "22px", color: isEnrolled ? "#10b981" : "inherit" }}>
                          {isEnrolled ? "Enrolled" : priceInfo.formatted}
                        </span>
                      </div>
                      <button
                        type="button"
                        className={`sp-enroll-btn ${isEnrolled ? "enrolled-btn" : ""}`}
                        onClick={() => handleOpenEnrollment(course, priceInfo.formatted)}
                      >
                        {isEnrolled ? "Enrolled ✓" : "Enroll Now"}
                      </button>
                    </div>
                  </article>
                );
              })}
            </div>
          )}

          {/* Modal */}
          {selectedCourseForModal && (
            <div className="sp-modal-backdrop" onClick={() => setSelectedCourseForModal(null)}>
              <div className="sp-modal-card" onClick={(e) => e.stopPropagation()}>
                <button className="sp-modal-close" onClick={() => setSelectedCourseForModal(null)}>✕</button>
                <span className="sp-badge-pill">{selectedCourseForModal.course.mainCategory || "Masterclass"}</span>
                <h3 style={{ fontSize: "24px", fontWeight: 800, margin: "6px 0 10px 0" }}>{selectedCourseForModal.course.courseName}</h3>
                <p style={{ fontSize: "14px", color: "#64748b", lineHeight: 1.6 }}>{selectedCourseForModal.course.description}</p>
                <div className="sp-modal-perks">
                  <div>✓ Lifetime access to cohort blueprints & recordings</div>
                  <div>✓ Async instructor Q&A & project feedback</div>
                  {selectedCourseForModal.course.refundable && (
                    <div>✓ <strong>100% money-back guarantee</strong> within 14 days</div>
                  )}
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "12px 0", borderTop: "1px solid #e2e8f0" }}>
                  <span style={{ color: "#64748b" }}>Total Tuition:</span>
                  <span style={{ fontSize: "24px", fontWeight: 800 }}>{selectedCourseForModal.formattedPrice}</span>
                </div>
                <div style={{ marginTop: "20px", display: "flex" }}>
                  <button
                    type="button"
                    className="sp-enroll-btn"
                    style={{ flex: 1, justifyContent: "center", padding: "14px" }}
                    onClick={handleConfirmEnrollment}
                  >
                    Confirm & Complete Enrollment
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* Toast */}
          {toastMessage && (
            <div className="sp-toast">
              <span>{toastMessage}</span>
            </div>
          )}
        </section>
      );
    }

    function App() {
      const [accentColor, setAccentColor] = useState("#2563EB");
      const [cardBorderRadius, setCardBorderRadius] = useState(16);

      return (
        <div>
          <div className="sp-dev-panel">
            <div style={{ fontWeight: 700 }}>⚡ Framer Property Controls Simulator</div>
            <div className="sp-dev-controls">
              <div className="sp-dev-control-item">
                <label>Accent Color:</label>
                <input
                  type="color"
                  value={accentColor}
                  onChange={(e) => setAccentColor(e.target.value)}
                  className="sp-dev-input"
                />
              </div>
              <div className="sp-dev-control-item">
                <label>Border Radius ({cardBorderRadius}px):</label>
                <input
                  type="range"
                  min="4"
                  max="32"
                  step="2"
                  value={cardBorderRadius}
                  onChange={(e) => setCardBorderRadius(Number(e.target.value))}
                />
              </div>
            </div>
          </div>

          <header className="sp-nav">
            <a href="#" className="sp-brand">
              <div className="sp-brand-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
              </div>
              Skillpath
            </a>
            <nav className="sp-nav-links">
              <a href="#courses" className="sp-nav-link">Courses</a>
              <a href="#about" className="sp-nav-link">Methodology</a>
              <a href="#pricing" className="sp-nav-link">Pricing</a>
            </nav>
          </header>

          <section className="sp-hero">
            <div className="sp-hero-pill">
              <span>●</span> Cohort 2026 Enrollments Open
            </div>
            <h1 className="sp-hero-title">
              Real-world systems for creators & operators.
            </h1>
            <p className="sp-hero-desc">
              Master the execution, business frameworks, and craft behind today's top digital businesses with practical, project-based courses.
            </p>
            <div className="sp-hero-cta-group">
              <a href="#courses" className="sp-btn-primary">
                Browse Masterclasses
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
              </a>
              <a href="#about" className="sp-btn-secondary">
                Our Learning Philosophy
              </a>
            </div>
          </section>

          <div id="courses">
            <SkillpathCourses
              accentColor={accentColor}
              cardBorderRadius={cardBorderRadius}
            />
          </div>

          <footer className="sp-footer">
            <div className="sp-footer-inner">
              <div className="sp-brand" style={{ fontSize: "17px" }}>
                <div className="sp-brand-icon" style={{ width: "26px", height: "26px" }}>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
                </div>
                Skillpath
              </div>
              <div className="sp-footer-links">
                <a href="#terms" className="sp-footer-link">Terms of Service</a>
                <a href="#privacy" className="sp-footer-link">Privacy Policy</a>
                <a href="#contact" className="sp-footer-link">Support & Contact</a>
              </div>
              <div className="sp-footer-copy">
                &copy; {new Date().getFullYear()} Skillpath Technologies Inc. All rights reserved.
              </div>
            </div>
          </footer>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
